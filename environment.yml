name: waveflow
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.4.0
  - scipy=1.17.0
  - pandas=2.3.3
  - xarray=2025.12.0
  - matplotlib-base=3.10.8
  - cartopy=0.25.0
  - shapely=2.1.2
  - pyproj=3.7.2
  - rasterio=1.5.1
  - affine=3.0.1
  - netcdf4=1.7.3
  - h5py=3.15.1
  - pyarrow=24.0.0
  - pillow=12.0.0
  - pymupdf=1.28.2
  - pyyaml=6.0.3
  - tqdm=4.67.1
  - requests=2.32.5
  - fonttools=4.61.1
  - pip
  - pip:
      # The CUDA build is required for exact inference; replace cu128 with
      # your CUDA wheel if needed (see requirements-pip.txt).
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.1+cu128
      - torchvision==0.24.1+cu128
