# Size-sweep R2: base (12 layers, 384 hidden, 6 heads, ~27M params) control arm at 50 epochs.
# Same recipe as configs_asym_scratch_v2.yaml except model_type + batch raised to 700/rank
# (global batch 1400; lr auto-scales with batch).
training:
  epochs: 50
  scheduler_epochs: 50
  log_interval: 5
  batch_size: 500
  seed: 42
  base_learning_rate: 5e-5
  base_batch_size: 128
  learning_rate: 1e-5
  checkpoint_interval: 5
  warmup_epochs: 2
  scheduler_type: cosine
  grad_clip_norm: 1.0
  use_ema: true
  ema_decay: 0.999
  ema_update_after_step: 100
  use_prores: false
  prores_warmup_epochs: 1
  extreme_loss_weight: 8.0
  extreme_loss_thresh: 3.0
  extreme_asym: 4.0
data:
  data_dir: ./data/hindcast/processed_npz
  coord_file_path: ./data/hindcast/hk_coordinates.npy
  stats_file: ./data/hindcast/wave_data_stats.json
  era5_stats_file: ./data/era5/era5_statistics.json
  variables:
  - hs
  - tp
  - dm
  - elev
  era5_region: 2
  cluster_file: ./data/hindcast/hk_clusters_512.npz
  region: hk
  era5_dir: ./data/era5/npz_files
  file_format: npz
  era5_file_format: npz
  train_max_year: 2018
dataset:
  num_workers: 24
  pin_memory: true
  use_patches: true
  prefetch_factor: 4
  persistent_workers: true
model:
  in_channels: 5
  conditional_generation: true
  model_type: base
  era5_encoder_type: cnn
  era5_patch_size: 8
  era5_num_frames: 8
  coord_encoding_type: fourier
  local_coord_type: 2d
  use_decoder_coord_encoding: false
  decoder_mlp_depth: 2
  prediction_type: v_pred
  t_eps: 1e-6
  use_amp: true
  compile: true
  qk_norm: true
  use_layer_scale: false
  multimodal_fusion_type: cross_attn
  use_tod_conditioning: true
  use_extreme_conditioning: true
sampling:
  total_samples: 100
  steps: 50
  batch_size: 128
  save_dir: samples
  test_subset_ratio: 1
  sample_split: test
  ensemble_size: 10
  resume_sample_path: null
  use_ema_for_sampling: true
  atm_source: era5
  ens_lead_time: 72
  ens_dir: ./data/ifs/ens
checkpoint:
  resume_path: null
  resume_training: false
  load_optimizer: true
work_dir:
  path: null
  base_dir: ./output/results/hk_cleaned/all_var/f8_blr5e-5_amp_stable_tod/size_sweep
  prefix: base_v1
